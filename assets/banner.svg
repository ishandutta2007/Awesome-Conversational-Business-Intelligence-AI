<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.9; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      50% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.85; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      30% { opacity: 0.4; }
      70% { opacity: 0.4; }
      100% { transform: translateY(450px); opacity: 0; }
    }

    .orb-anim1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 320px; }
    .dash-flow { stroke-dasharray: 8 6; animation: flowLine 15s linear infinite; }
    .pill-float-1 { animation: floatPill1 4.5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 5.5s ease-in-out infinite; }
    .scan-beam { animation: scanline 7s ease-in-out infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background Layer) -->
  <circle class="orb-anim1" cx="220" cy="120" r="180" fill="url(#glowGrad1)" />
  <circle class="orb-anim2" cx="980" cy="300" r="220" fill="url(#glowGrad2)" />

  <!-- Tech Grid Background -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Animated Cyber Data Circuit Lines (Behind Content) -->
  <g opacity="0.45">
    <path class="dash-flow" d="M 0 340 Q 300 370 600 340 T 1200 350" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="dash-flow" d="M 0 90 Q 400 60 800 100 T 1200 70" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <line class="scan-beam" x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Foreground Content Area: Perfectly Protected & Centered -->
  <g id="foreground-content">
    <!-- Top Pill: Status/Focus Indicator -->
    <g class="pill-float-1" transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-160" cy="0" r="5" fill="#38bdf8" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-142" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM &bull; AUTONOMOUS ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Conversational Business Intelligence
    </text>

    <!-- Gradient AI & GenBI Tagline -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#accentGrad)" filter="url(#softGlow)" letter-spacing="0.5">
      &amp; AI Analytics Agents
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Natural Language Query &bull; Semantic Models &bull; Text-to-SQL Agents &bull; Self-Hosted GenBI
    </text>

    <!-- Bottom Feature Pills Group -->
    <g class="pill-float-2" transform="translate(600, 325)">
      <!-- Pill 1: Text-to-SQL -->
      <g transform="translate(-330, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Text-to-SQL</text>
      </g>

      <!-- Pill 2: Semantic Layers -->
      <g transform="translate(-110, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🧠 Semantic Layers</text>
      </g>

      <!-- Pill 3: Autonomous Agents -->
      <g transform="translate(115, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🤖 Autonomous Agents</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(325, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌟 100% Curated</text>
      </g>
    </g>

    <!-- Subtle border line around banner -->
    <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
  </g>
</svg>
